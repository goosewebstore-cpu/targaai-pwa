<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TargaAI - Scopri tutto sulla tua auto in 3 secondi</title>
<meta name="description" content="Scansiona la targa e ottieni scheda tecnica, valutazione e storico del veicolo in pochi secondi. TargaAI e la tua app per ogni auto.">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TargaAI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('installBanner');
  if (banner && !window.matchMedia('(display-mode: standalone)').matches) {
    banner.style.display = 'flex';
  }
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then((choice) => {
    if (choice.outcome === 'accepted') {
      document.getElementById('installBanner').style.display = 'none';
    }
    deferredPrompt = null;
  });
}
if (window.matchMedia('(display-mode: standalone)').matches) {
  const b = document.getElementById('installBanner');
  if (b) b.style.display = 'none';
}
</script>
<style>
:root{--bg:#F5F5F7;--surface:#FFFFFF;--text:#1D1D1F;--text-secondary:#86868B;--border:#D2D2D7;--accent:#007AFF;--accent-dark:#0051D5;--success:#34C759;--warning:#FF9500;--danger:#FF3B30;--radius:12px;--radius-sm:8px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.47059;letter-spacing:-0.022em;-webkit-font-smoothing:antialiased;}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:80px;}
@media(min-width:431px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border);}}
.header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-size:21px;font-weight:700;letter-spacing:-0.021em;color:var(--text);}
.logo span{color:var(--accent);}
.header-actions{display:flex;gap:12px;align-items:center;}
.header-btn{font-size:15px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px 8px;}
.hero{padding:32px 20px 24px;text-align:center;}
.hero h1{font-size:28px;font-weight:700;line-height:1.125;letter-spacing:-0.021em;margin-bottom:8px;}
.hero p{font-size:17px;color:var(--text-secondary);line-height:1.23536;}
.scan-section{padding:0 20px 16px;}
.scan-box{background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;cursor:pointer;transition:border-color 0.2s;}
.scan-box:hover{border-color:var(--accent);}
.scan-box.dragover{border-color:var(--accent);background:#F0F7FF;}
.scan-icon{width:56px;height:56px;margin:0 auto 16px;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.scan-icon svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.scan-title{font-size:17px;font-weight:600;margin-bottom:4px;}
.scan-sub{color:var(--text-secondary);font-size:13px;}
#fileInput{display:none;}
.manual{padding:0 20px 20px;}
.input-row{display:flex;gap:10px;}
.targa-input{flex:1;padding:14px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:2px;outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
.targa-input:focus{border-color:var(--accent);}
.targa-input::placeholder{color:var(--text-secondary);text-transform:none;letter-spacing:0;font-weight:400;font-size:15px;}
.btn{padding:14px 20px;border-radius:var(--radius-sm);border:none;font-size:17px;font-weight:600;cursor:pointer;transition:opacity 0.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none;}
.btn:active{opacity:0.8;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface);color:var(--accent);border:1px solid var(--border);}
.btn-full{width:100%;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.skeleton{padding:0 20px 20px;display:none;}
.skeleton.active{display:block;}
.skeleton-card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:12px;border:1px solid var(--border);}
.skeleton-status{text-align:center;padding:12px;color:var(--text-secondary);font-size:13px;font-weight:500;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.report{padding:0 20px 20px;display:none;}
.report.active{display:block;animation:fadeIn 0.35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.vehicle-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.vehicle-header{padding:20px;background:var(--bg);border-bottom:1px solid var(--border);}
.plate{display:inline-block;background:#1D1D1F;color:#fff;padding:8px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:18px;letter-spacing:2px;margin-bottom:10px;}
.vehicle-name{font-size:20px;font-weight:700;margin-bottom:3px;letter-spacing:-0.021em;}
.vehicle-meta{font-size:15px;color:var(--text-secondary);}
.vehicle-body{padding:20px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-item{background:var(--bg);padding:14px;border-radius:var(--radius-sm);}
.info-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;font-weight:500;}
.info-value{font-size:15px;font-weight:600;}
.report-actions{display:flex;gap:10px;margin-top:16px;}
.report-actions .btn{flex:1;font-size:15px;padding:12px;}
.error-box{background:#FFF2F2;border:1px solid #FFD5D5;border-radius:var(--radius);padding:20px;text-align:center;margin:0 20px 20px;display:none;}
.error-box.active{display:block;}
.error-title{font-size:17px;font-weight:600;color:var(--danger);margin-bottom:4px;}
.error-sub{font-size:14px;color:var(--text-secondary);margin-bottom:12px;}
.vehicle-image{width:100%;max-height:200px;object-fit:contain;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:12px;}
#installBanner{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 20px;align-items:center;justify-content:space-between;z-index:999;max-width:430px;margin:0 auto;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,0.92);color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;z-index:2000;opacity:0;transition:all 0.3s ease;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">Targa<span>AI</span></div>
    <div class="header-actions">
      <button class="header-btn" id="clearBtn" onclick="clearReport()" style="display:none">Nuova ricerca</button>
    </div>
  </header>

  <section class="hero" id="heroSection">
    <h1>Scopri tutto sulla tua auto in 3 secondi</h1>
    <p>Inserisci una targa italiana e ottieni scheda tecnica completa e valutazione istantanea.</p>
  </section>

  <section class="manual">
    <div class="input-row">
      <input type="text" class="targa-input" id="targaInput" placeholder="Es. AB123CD" maxlength="7" autocomplete="off">
      <button class="btn btn-primary" id="searchBtn" onclick="searchPlate()">Cerca</button>
    </div>
  </section>

  <div class="skeleton" id="skeletonBox">
    <div class="skeleton-card">
      <div class="skeleton-status" id="skeletonStatus">Ricerca targa in corso...</div>
    </div>
  </div>

  <div class="error-box" id="errorBox">
    <div class="error-title" id="errorTitle">Errore</div>
    <div class="error-sub" id="errorSub">Impossibile trovare dati per questa targa.</div>
    <button class="btn btn-secondary" onclick="clearReport()">Riprova</button>
  </div>

  <div class="report" id="reportBox">
    <div class="vehicle-card">
      <div class="vehicle-header">
        <div class="plate" id="reportPlate">AB123CD</div>
        <div class="vehicle-name" id="reportName">---</div>
        <div class="vehicle-meta" id="reportMeta">---</div>
      </div>
      <div class="vehicle-body">
        <img class="vehicle-image" id="vehicleImage" style="display:none" alt="Veicolo">
        <div class="info-grid" id="reportGrid"></div>
      </div>
    </div>
  </div>
</div>

<div id="installBanner">
  <div style="font-size:15px;font-weight:600;">Installa TargaAI sul telefono</div>
  <button class="btn btn-primary" onclick="installApp()" style="padding:8px 16px;font-size:15px;">Installa</button>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://www.regcheck.org.uk/api/reg.asmx';
let currentVehicleData = null;
let searchTimeout = null;

document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('targaInput');
  inp.addEventListener('input', e => {
    clearTimeout(searchTimeout);
    const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    e.target.value = v;
    if (v.length >= 5) searchTimeout = setTimeout(() => searchPlate(), 800);
  });
  inp.addEventListener('keypress', e => { if (e.key === 'Enter') searchPlate(); });
});

async function lookupPlate(plate) {
  const url = `${API_BASE}/CheckItaly?RegistrationNumber=${encodeURIComponent(plate)}&username=demo`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('API risponde con errore ' + resp.status);
  const xmlText = await resp.text();
  const match = xmlText.match(/<vehicleJson>([\s\S]*?)<\/vehicleJson>/);
  if (!match) throw new Error('Formato risposta non valido');
  const jsonStr = match[1].replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  const data = JSON.parse(jsonStr);
  return data;
}

function formatData(data) {
  const make = data.CarMake?.CurrentTextValue || data.CarMake || '';
  const model = data.CarModel?.CurrentTextValue || data.CarModel || '';
  const year = data.RegistrationYear || '';
  const fuel = data.FuelType?.CurrentTextValue || data.FuelType || '';
  const engine = data.EngineSize?.CurrentTextValue || '';
  const version = data.Version || '';
  const doors = data.NumberOfDoors?.CurrentTextValue || data.NumberOfDoors || '';
  const transmission = data.Transmission?.CurrentTextValue || data.Transmission || '';
  const bodyStyle = data.BodyStyle?.CurrentTextValue || data.BodyStyle || '';
  const seats = data.NumberOfSeats?.CurrentTextValue || data.NumberOfSeats || '';
  const description = data.Description || `${make} ${model}`;

  let cv = '', cc = '';
  if (engine) {
    const cvMatch = engine.match(/(\d+)\s*cv/i);
    if (cvMatch) cv = cvMatch[1];
    const ccMatch = engine.match(/([\d,.]+)\s*cc/i);
    if (ccMatch) cc = ccMatch[1].replace(',', '');
  }

  return { make, model, year, fuel, engine, version, doors, transmission, bodyStyle, seats, description, cv, cc };
}

async function searchPlate() {
  const input = document.getElementById('targaInput');
  const plate = input.value.toUpperCase().trim();
  if (plate.length < 5) {
    showToast('Inserisci una targa valida (es. AB123CD)', 'error');
    return;
  }

  const searchBtn = document.getElementById('searchBtn');
  const heroSection = document.getElementById('heroSection');
  const reportBox = document.getElementById('reportBox');
  const errorBox = document.getElementById('errorBox');
  const skeletonBox = document.getElementById('skeletonBox');
  const clearBtn = document.getElementById('clearBtn');

  reportBox.classList.remove('active');
  errorBox.classList.remove('active');
  skeletonBox.classList.add('active');
  searchBtn.disabled = true;
  searchBtn.textContent = '...';
  document.getElementById('skeletonStatus').textContent = 'Ricerca ' + plate + '...';
  clearBtn.style.display = 'none';

  try {
    const data = await lookupPlate(plate);
    const f = formatData(data);
    currentVehicleData = f;

    const fullName = f.make && f.model ? `${f.make} ${f.model}` : data.Description || plate;
    document.getElementById('reportPlate').textContent = plate;
    document.getElementById('reportName').textContent = f.version || fullName;
    document.getElementById('reportMeta').textContent = [f.year, f.fuel].filter(Boolean).join(' - ');

    const imageUrl = data.ImageUrl;
    const imgEl = document.getElementById('vehicleImage');
    if (imageUrl) {
      imgEl.src = imageUrl;
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
    }

    const grid = document.getElementById('reportGrid');
    const items = [
      { label: 'Marca', value: f.make },
      { label: 'Modello', value: f.model },
      { label: 'Anno', value: f.year },
      { label: 'Versione', value: f.version },
      { label: 'Alimentazione', value: f.fuel },
      { label: 'Motore', value: f.engine },
      { label: 'Carrozzeria', value: f.bodyStyle },
      { label: 'Porte', value: f.doors },
      { label: 'Posti', value: f.seats },
      { label: 'Cambio', value: f.transmission }
    ];
    grid.innerHTML = items.filter(i => i.value).map(i =>
      `<div class="info-item"><div class="info-label">${i.label}</div><div class="info-value">${i.value}</div></div>`
    ).join('');

    heroSection.style.display = 'none';
    reportBox.classList.add('active');
    clearBtn.style.display = 'inline-block';
    setTimeout(() => reportBox.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  } catch (err) {
    errorBox.classList.add('active');
    document.getElementById('errorTitle').textContent = 'Nessun dato trovato';
    document.getElementById('errorSub').textContent = `Nessun veicolo trovato per la targa "${plate}". Verifica il formato (es. AB123CD) e riprova.`;
  } finally {
    skeletonBox.classList.remove('active');
    searchBtn.disabled = false;
    searchBtn.textContent = 'Cerca';
  }
}

function clearReport() {
  document.getElementById('reportBox').classList.remove('active');
  document.getElementById('errorBox').classList.remove('active');
  document.getElementById('heroSection').style.display = 'block';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('targaInput').value = '';
  document.getElementById('targaInput').focus();
  currentVehicleData = null;
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
